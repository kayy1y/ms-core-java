# Perfil para correr en la máquina con docker-compose (SQL Server local), sin APIM ni Service Bus.
spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=coredb;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${SQL_PASSWORD:Local_Passw0rd!}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  jwt:
    # Valor solo para desarrollo local (base64). En Azure se usa otro, guardado como secreto.
    secret: ${JWT_SECRET:NRpRoSlMSVquYFDjVghl0cgzgdZ5IDIA2jFivCUAbeHR+65IfKYEAaFNz5NCn2wr}
  google:
    demo-enabled: true
  events:
    enabled: false
  apim:
    cert-check: false
  catalog:
    mode: stub
