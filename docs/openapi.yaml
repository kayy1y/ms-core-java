      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAdminUserRowDto"
  /v1/admin/stats:
    get:
      tags:
      - Administración
      summary: "Usuarios, sesiones por estado y actividad de 30 días"
      operationId: stats
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminStatsResponse"
  /v1/admin/sessions:
    get:
      tags:
      - Administración
      summary: Todas las sesiones (sin enlaces ni lugares)
      operationId: sessions
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: modality
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseSessionResponse"
  /v1/me/availability/blocked-dates/{id}:
    delete:
      tags:
      - Disponibilidad
      summary: Desbloquear una fecha
      operationId: deleteBlocked
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: id
        in: path
        required: true
