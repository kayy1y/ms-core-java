openapi: 3.0.1
info:
  title: SkillGrow · MS1 Core
  description: "Usuarios, login, disponibilidad y sesiones de mentoría. Fechas en\
    \ epoch ms; días de calendario en YYYY-MM-DD. Errores: { status, code, message,\
    \ details, timestampEpochMs, path }."
  version: 1.0.0
security:
- bearer: []
tags:
- name: Usuarios
  description: Perfil público de otros usuarios
- name: Administración
  description: "Usuarios, sesiones y estadísticas (rol admin)"
- name: Auth
  description: Registro y login; devuelven el JWT que valida APIM
- name: Perfil
  description: Perfil del usuario autenticado
- name: Disponibilidad
  description: "Días de atención, fechas bloqueadas y días reservables"
- name: Sesiones
  description: "Reservar, aceptar, rechazar, reprogramar, cancelar y completar"
- name: Gamificación
  description: Insignias y logros
paths:
  /v1/sessions/{id}/meeting:
    put:
      tags:
      - Sesiones
      summary: Cambiar el enlace de una sesión virtual
      operationId: meeting
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /v1/sessions/{id}/location:
    put:
      tags:
      - Sesiones
      summary: Cambiar el lugar de una sesión presencial
      operationId: location
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /v1/me:
    get:
      tags:
      - Perfil
      summary: Mi perfil
      operationId: me
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags:
      - Perfil
      summary: "Editar nombre, bio, foto, datos académicos y profesionales"
      operationId: update
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonNode"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /v1/me/teach-skills:
    put:
      tags:
      - Perfil
      summary: Reemplazar las habilidades que enseño
      operationId: teachSkills
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeachSkillsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /v1/me/knowledge:
    put:
      tags:
      - Perfil
      summary: Reemplazar los conocimientos libres
      operationId: knowledge
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /v1/me/interests:
    put:
      tags:
      - Perfil
      summary: Reemplazar los intereses de aprendizaje
      operationId: interests
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterestsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /v1/me/email-preferences:
    put:
      tags:
      - Perfil
      summary: Activar o desactivar correos por tipo de notificación
      operationId: emailPreferences
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: boolean
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /v1/me/availability/rules/{id}:
    put:
      tags:
      - Disponibilidad
      summary: Cambiar los servicios de un día
      operationId: updateRule
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RuleDto"
    delete:
      tags:
      - Disponibilidad
      summary: Quitar un día
      operationId: deleteRule
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
  /v1/admin/badges/{id}:
    put:
      tags:
      - Gamificación
      summary: Editar insignia (admin)
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadgeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BadgeDto"
  /v1/sessions:
    get:
      tags:
      - Sesiones
      summary: "Mis sesiones (role=learner|mentor|all, scope=upcoming|past|cancelled)"
      operationId: list
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: role
        in: query
        required: false
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseSessionResponse"
    post:
      tags:
      - Sesiones
      summary: Reservar un día (publica SESSION_REQUESTED al mentor)
      operationId: create
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /v1/me/availability/rules:
    post:
      tags:
      - Disponibilidad
      summary: Marcar un día de la semana como disponible
      operationId: addRule
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RuleDto"
  /v1/me/availability/blocked-dates:
    post:
      tags:
      - Disponibilidad
      summary: Bloquear una fecha
      operationId: addBlocked
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockedDateRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BlockedDateDto"
  /v1/auth/register:
    post:
      tags:
      - Auth
      summary: Crear cuenta con correo y contraseña
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Cerrar sesión
      operationId: logout
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      responses:
        "204":
          description: No Content
  /v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login con correo y contraseña
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/google:
    post:
      tags:
      - Auth
      summary: Login con el idToken de Google
      operationId: google
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/admin/badges:
    get:
      tags:
      - Gamificación
      summary: "Todas las insignias, incluidas las inactivas (admin)"
      operationId: all
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseBadgeDto"
    post:
      tags:
      - Gamificación
      summary: Crear insignia (admin)
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadgeRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BadgeDto"
  /v1/sessions/{id}/reschedule:
    patch:
      tags:
      - Sesiones
      summary: Proponer otro día
      operationId: reschedule
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /v1/sessions/{id}/reject:
    patch:
      tags:
      - Sesiones
      summary: Rechazar una solicitud pendiente (mentor)
      operationId: reject
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /v1/sessions/{id}/complete:
    patch:
      tags:
      - Sesiones
      summary: "Marcar como completada (mentor, desde el día de la sesión)"
      operationId: complete
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /v1/sessions/{id}/cancel:
    patch:
      tags:
      - Sesiones
      summary: Cancelar
      operationId: cancel
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /v1/sessions/{id}/accept:
    patch:
      tags:
      - Sesiones
      summary: Aceptar (mentor) o confirmar el nuevo día (la otra parte)
      operationId: accept
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /v1/admin/users/{id}/status:
    patch:
      tags:
      - Administración
      summary: Suspender o reactivar (suspender cancela sus sesiones activas)
      operationId: changeStatus
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChangeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserStatusDto"
  /v1/admin/badges/{id}/status:
    patch:
      tags:
      - Gamificación
      summary: Activar o desactivar insignia (admin)
      operationId: status
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadgeActiveRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BadgeDto"
  /v1/users/{id}:
    get:
      tags:
      - Usuarios
      summary: Perfil público (sin correo)
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicUserResponse"
  /v1/users/{id}/badges:
    get:
      tags:
      - Gamificación
      summary: Insignias de un usuario
      operationId: userBadges
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserBadgeDto"
  /v1/sessions/{id}:
    get:
      tags:
      - Sesiones
      summary: Detalle de una sesión (solo participantes)
      operationId: get_1
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /v1/services/{id}/available-days:
    get:
      tags:
      - Disponibilidad
      summary: "Días reservables de un servicio (desde mañana, con cupos)"
      operationId: availableDays
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      - name: excludeSessionId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableDayDto"
  /v1/me/requests:
    get:
      tags:
      - Sesiones
      summary: Solicitudes que esperan mi respuesta (kind=received) o que envié (kind=sent)
      operationId: requests
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: kind
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseSessionResponse"
  /v1/me/availability:
    get:
      tags:
      - Disponibilidad
      summary: Mis días de atención y fechas bloqueadas
      operationId: get_2
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
  /v1/me/achievements:
    get:
      tags:
      - Gamificación
      summary: Mi progreso hacia la próxima insignia de cada criterio
      operationId: achievements
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AchievementDto"
  /health:
    get:
      tags:
      - health-controller
      operationId: health
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /v1/health:
    get:
      tags:
      - health-controller
      operationId: health_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /v1/badges:
    get:
      tags:
      - Gamificación
      summary: Catálogo de insignias activas
      operationId: badges
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BadgeDto"
  /v1/admin/users:
    get:
      tags:
      - Administración
      summary: Usuarios con búsqueda y filtros
      operationId: users
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: role
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
