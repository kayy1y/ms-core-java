# SQL Server local para desarrollo. En Azure se usa Azure SQL Database.
# Uso: docker compose up -d   →   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Passw0rd!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Local_Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Crea la base coredb una sola vez (Flyway crea las tablas al arrancar el servicio).
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -S
      - sqlserver
      - -U
      - sa
      - -P
      - "Local_Passw0rd!"
      - -C
      - -Q
      - "IF DB_ID('coredb') IS NULL CREATE DATABASE coredb"
    restart: "no"
